<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f2e8"><title>Word Texture</title><link rel="stylesheet" href="styles.css"></head><body><main class="panel"><header><div class="brand"><strong>Word Texture</strong></div><div class="header-actions"><button class="icon" aria-label="요청 로그">☰</button><button class="icon" aria-label="API 설정">⚙</button></div></header><form id="analyze-form"><label for="term">단어 또는 구절</label><input id="term" placeholder="factor, linger, a trace of…" maxlength="180"><div class="context-label"><label for="context">주변 문장</label><button type="button" class="text-button">선택 부분 → 단어</button></div><textarea id="context" rows="3" placeholder="단어가 포함된 문장을 넣으면 문맥을 고려해 읽습니다. (선택)"></textarea><div class="submit-row"><button type="button" class="primary">말의 결 읽기</button></div></form><footer><span class="dot"></span><span>현재 모델</span></footer></main></body></html>
